[project]
name = "healthvault-local"
version = "0.1.0"
description = "Private local-first family health and prescription vault"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "pillow>=10,<12",
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pillow-heif>=0.18", "pypdf>=5,<7"]
voice = ["faster-whisper>=1.1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/backend"]
omit = ["tests/*"]
